name: Weekly VAD monitor run

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline (fetch, filter, store, generate, email)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python main.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "vad-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/records.sqlite3 docs/index.html docs/distributors.html
          git diff --cached --quiet || git commit -m "Weekly monitor update $(date -u +%Y-%m-%d)"
          git push
